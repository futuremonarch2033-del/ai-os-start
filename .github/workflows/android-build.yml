name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode pinned debug keystore
        run: base64 -d debug.keystore.b64 > debug.keystore

      - name: Probe Gemini models with generateContent (temporary diagnostic)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for M in gemini-2.5-flash gemini-2.5-flash-lite gemini-flash-latest gemini-flash-lite-latest gemini-3.5-flash gemini-3.6-flash gemini-3.7-flash gemini-3.8-flash gemini-3.1-flash-lite; do
            CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" -d '{"contents":[{"parts":[{"text":"Say OK"}]}]}' "https://generativelanguage.googleapis.com/v1beta/models/$M:generateContent")
            echo "$M -> HTTP $CODE"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        run: gradle assembleDebug
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
